[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchworks"
version = "0.0.0"
description = "An embodied graph architecture in which many small predictors, each working in its own metric space, are reconciled into a coherent model of a world none of them sees whole."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
dependencies = [
    # Pinned per docs/spec/09-the-build-stack.md, "The compute target": the
    # development laptop (Intel x86_64 macOS, CPU only) is a correctness-only
    # target on pinned wheels. These caps are wheel availability on that
    # laptop, not preference -- if a newer release is ever needed, the laptop
    # stops being the reference machine rather than the pin moving.
    "torch==2.2.2",
    "mujoco==3.10.0",
    # The sandbox is a literal gymnasium.Env. 1.x is the floor: the
    # conformance test in tests/test_sandbox_conformance.py asserts that
    # `check_step_determinism` is the one check `check_env` fails, and 0.29
    # has no such check -- it was added in 1.0.
    "gymnasium>=1.0,<2",
    # torch==2.2.2's macOS wheel is built against NumPy 1.x; importing it
    # under NumPy 2.x fails (ABI mismatch). Capped for the same
    # correctness-only reason as the two pins above.
    "numpy<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/patchworks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# benchmarks/ holds scripts rather than a package; on the path so the suite can
# smoke-test them and they do not rot silently against the code they measure.
#
# tests/ is on it so `from conftest import SMALL` is an import rather than an
# accident: without this the eight files that share the small dome resolve it
# only through the sys.path entry pytest's default "prepend" import mode
# happens to leave behind, and adding a tests/__init__.py -- or running under
# --import-mode=importlib -- takes it away again.
pythonpath = ["benchmarks", "tests"]
