name: Problem registers

# The networked half of the three problem registers (#279 §Generation, #283),
# mirroring `.github/workflows/constant-provenance.yml`.
#
# The hermetic half is `tests/test_problem_registers.py`, which holds the
# parser and the renderer against fixture payloads. It cannot ask GitHub
# whether a problem was opened, relabelled or commented on since the render,
# and must not learn how: `tests/test_cli.py` exists in part to break every
# route from the suite to a subprocess, and a `gh`-shelling test would be the
# suite's first network-dependent one -- failing offline, on the development
# laptop, which is where the issues are written from.
#
# So CI can never check these three files for staleness, and freshness is this
# workflow's job instead: it regenerates and commits when the render changes.
# `--check` still exists, for a human at a terminal.
#
# The rendered files are therefore briefly stale by construction, and are never
# the authority. That is the point: GitHub is the definition site, and the file
# exists so an agent can read the register without a network call or a token.

on:
  # Every event that can change the render, and no others. Labels decide which
  # issues are in the query at all; the body carries the field block; and a
  # comment is where a proposal specific to one problem lives, which is what
  # makes this not a labels-only query. `edited` matters more here than
  # `opened` -- `@status` on a proposal is edited in place as it changes, and
  # the comment thread around it is the history.
  issues:
    types: [opened, closed, edited, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  # A net for anything that changed while this workflow was broken, disabled,
  # or while the repository had no runner minutes. Mondays, early, and not on
  # `constant-provenance.yml`'s minute.
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: ${{ github.workflow }}
  # The opposite of `constant-provenance.yml`'s setting, deliberately. That
  # workflow files issues and must not lose a run. This one renders a pure
  # projection: a superseded run is worth nothing, because the run that
  # cancelled it reads the same tracker and subsumes it -- and comment events
  # fire often enough that not cancelling would queue runs behind each other
  # for no gain.
  cancel-in-progress: true

jobs:
  render:
    # Skipped for the traffic that cannot move a row. Every issue event and
    # every comment in the repository reaches this workflow, and all but a few
    # of them are on tickets no register reads.
    #
    # Both arms are needed, and the second is not redundant: on `unlabeled`
    # the payload's `issue.labels` no longer carries the label that was just
    # removed, so an issue leaving a register would be filtered out by the
    # first arm alone -- and leaving is exactly a change the render must see.
    # `github.event.label` is null on every other event, and `startsWith` of
    # null is false, so it costs nothing there.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || contains(join(github.event.issue.labels.*.name, ','), 'register:')
      || startsWith(github.event.label.name, 'register:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No install step and no dependencies beyond `gh`, which the runner image
      # ships. The generator reads `gh`'s JSON with the standard library and
      # does not import patchworks, so this job does not pay for torch and
      # MuJoCo to answer a question about issue bodies -- on every comment
      # edited on a register ticket.
      - name: Render the three registers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/problem_registers.py

      - name: Commit the render if it moved
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          message='Re-render the problem registers from the tracker

          Automatic, by .github/workflows/problem-registers.yml. The tracker is
          the definition site; this file is a projection of it (#279).'

          if git diff --quiet -- docs/registers; then
            echo 'The render is unchanged.'
            exit 0
          fi

          # Three attempts, because main moves under this job: a merge landing
          # between the checkout and the push rejects it. There is nothing to
          # merge in that case and a rebase would be the wrong instrument --
          # the render is a pure function of the tracker, so the answer is to
          # throw this commit away, take whatever main now says, and render
          # again on top of it. The second render may legitimately produce no
          # diff at all, if the run that beat us here rendered the same rows.
          for attempt in 1 2 3; do
            git add docs/registers
            git commit -m "$message"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push $attempt rejected; re-rendering on top of origin/$BRANCH."
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            python tools/problem_registers.py
            if git diff --quiet -- docs/registers; then
              echo 'The render is unchanged against the new tip.'
              exit 0
            fi
          done
          echo "::error::Could not push the render after 3 attempts."
          exit 1
