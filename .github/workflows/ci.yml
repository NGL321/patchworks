name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # ubuntu-latest is the stable, always-available GitHub-hosted runner.
    # The torch/mujoco/numpy pins in pyproject.toml are justified by wheel
    # availability on the development laptop (Intel x86_64 macOS --
    # docs/spec/09-the-build-stack.md, "The compute target"), which stays a
    # manual, correctness-only check on that machine; GitHub's hosted
    # Intel-macOS runner images have been in flux, so CI does not pin to one
    # here rather than risk breaking on a retired or renamed label.
    runs-on: ubuntu-latest
    steps:
      # Every step below is pinned by `TestBothChecksRunInCI` in
      # tests/test_perturbation.py: each `run:` command, each `uses:`, and --
      # since a plugin reaches the run through what is installed -- the
      # dependency set the install line installs (#124). A step added, removed
      # or edited fails that class, so it is edited in the same change. That
      # is the whitelist working rather than a false positive.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install mujoco's runtime GL libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libosmesa6

      - name: Install patchworks
        run: pip install -e ".[dev]"

      - name: Run tests
        # The sandbox's observation is a 64x64 render, so the suite needs a GL
        # context. osmesa is the software one, and libosmesa6 is installed
        # above; the runner has no display and no GPU.
        #
        # Both halves of the locality guard ride on this one invocation
        # (docs/spec/09-the-build-stack.md, The locality guard, part 3): the
        # always-on tape assertion, which every test that ticks exercises, and
        # the perturbation test in tests/test_perturbation.py. A leaked
        # gradient is silent and flattering, so a selection flag here -- -k,
        # -m, --ignore, --deselect -- would switch the guard off without
        # anything going red. tests/test_perturbation.py holds that down.
        env:
          MUJOCO_GL: osmesa
        run: pytest
